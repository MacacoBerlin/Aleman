}
@media (prefers-color-scheme: dark){

}

}
*{box-sizing:border-box}
body{

const NOPT=[3,4,4], MAXW=[4,7,99];
const PLAN=[
 ['de2es','de2es','es2de','es2de','fill','fill','order','de2es'],
 ['es2de','conj','de2es','fill','fill','typeHint','typeHint','order'],
 ['type','type','type','conjType','fillType','fillType','order','order']
];
const FALL={conj:['es2de'],conjType:['type'],fillType:['type'],fill:['es2de'],order:['es2de'],typeHint:['es2de'],type:['es2de'],es2de:['de2es'],de2es:['es2de']};

function take(Dd,key){
  Dd._q=Dd._q||{};
  if(!Dd._q[key]||!Dd._q[key].length) Dd._q[key]=shuffle(Dd[key]);
  return Dd._q[key].pop();
}
function nextOf(Dd,key,used,pre,kf,filt){
  if(!Dd[key]||!Dd[key].length) return null;
  const n=Dd[key].length*2+2;
  for(let t=0;t<n;t++){
    const it=take(Dd,key); if(!it) return null;
    if(filt&&!filt(it)) continue;
    const k=pre+kf(it);
    if(!used.has(k)){ used.add(k); return it; }
  }
  return null;
}
function distract(v,pool,n,key){
  const out=[];
  for(const w of shuffle(pool)){
    if(w===v) continue;
    if(v.g&&w.g===v.g) continue;
    const x=baseEs(v.es),y=baseEs(w.es);
    if(x.includes(y)||y.includes(x)) continue;
    const val=w[key];
    if(val===v[key]||out.includes(val)) continue;
    out.push(val); if(out.length>=n) break;
  }
  return out;
}
function accepted(v,pool){ return [v.de].concat(v.g?pool.filter(w=>w.g===v.g).map(w=>w.de):[]); }
function mkHint(de){
  const s=strip(de).replace(/[!?.]/g,'');
  return s.split('').map((c,i)=>c===' '?' ':(i===0?c:'_')).join(' ');
}
function makeQ(kind,Dd,lv,used){
  const n=NOPT[lv];
  if(kind==='de2es'||kind==='es2de'||kind==='type'||kind==='typeHint'){
    const v=nextOf(Dd,'vocab',used,'v:',x=>x.de); if(!v) return null;
    const expl=v.de+' = '+v.es;
    if(kind==='de2es') return {kind:'mc',dir:'de2es',sub:'¿Qué significa en español?',prompt:v.de,opts:shuffle([v.es].concat(distract(v,Dd.vocab,n-1,'es'))),ans:v.es,say:v.de,explain:expl};
    if(kind==='es2de') return {kind:'mc',dir:'es2de',sub:'¿Cómo se dice en alemán?',prompt:v.es,opts:shuffle([v.de].concat(distract(v,Dd.vocab,n-1,'de'))),ans:v.de,say:v.de,explain:expl};
    return {kind:'type',dir:'es2de',sub:'Escríbelo en alemán',prompt:v.es,acc:accepted(v,Dd.vocab),show:v.de,hint:kind==='typeHint'?mkHint(v.de):'',say:v.de,explain:expl};
  }
  if(kind==='fill'||kind==='fillType'){
    const f=nextOf(Dd,'fills',used,'f:',x=>x.s); if(!f) return null;
    const full=f.s.replace('___',f.a);
    const base={dir:'fill',sub:'Completa la frase',prompt:f.s,tr:f.es,say:full,explain:full+' — '+f.es};
    if(kind==='fill') return Object.assign(base,{kind:'mc',opts:shuffle([f.a].concat(f.d.slice(0,n-1))),ans:f.a});
    return Object.assign(base,{kind:'type',acc:[f.a],show:f.a,hint:''});
  }
  if(kind==='order'){
    const ok=s=>{const c=s.de.split(' ').length;return lv===0?c<=4:lv===1?(c<=7&&c>=3):c>=5;};
    let s=nextOf(Dd,'sents',used,'s:',x=>x.de,ok);
    if(!s) s=nextOf(Dd,'sents',used,'s:',x=>x.de,x=>x.de.split(' ').length<=MAXW[lv]);
    if(!s) return null;
    const punct=(s.de.match(/[?!.]$/)||[''])[0];
    const words=s.de.replace(/[?!.]$/,'').split(' ').map(w=>w.replace(/,/g,''));
    let sh,k=0; do{sh=shuffle(words);k++;}while(k<12&&sh.join(' ')===words.join(' '));
    return {kind:'order',dir:'order',sub:'Ordena las palabras en alemán',prompt:s.es,words:sh,punct,acc:[s.de].concat(s.alt),show:s.de,say:s.de,explain:s.de+' — '+s.es};
  }
  if(kind==='conj'||kind==='conjType'){
    const c=nextOf(Dd,'conj',used,'c:',x=>x.inf); if(!c) return null;
    const i=Math.floor(Math.random()*6);
    const form=c.f[i];
    const base={dir:'conj',sub:'Conjuga el verbo',prompt:PR[i]+' ___ ('+c.inf+')',tr:c.inf+' = '+c.es,say:PRSAY[i]+' '+form,explain:PR[i]+' '+form+' ('+c.inf+' = '+c.es+')'};
    if(kind==='conj'){
      const forms=Array.from(new Set(c.f)).filter(x=>x!==form);
      return Object.assign(base,{kind:'mc',opts:shuffle([form].concat(shuffle(forms).slice(0,3))),ans:form});
    }
    return Object.assign(base,{kind:'type',acc:[form],show:form,hint:''});
  }
  return null;
}
function tryKind(kind,Dd,lv,used){
  let q=makeQ(kind,Dd,lv,used);
  if(q) return q;
  for(const k of (FALL[kind]||[])){ q=makeQ(k,Dd,lv,used); if(q) return q; }
  return makeQ('de2es',Dd,lv,used)||makeQ('es2de',Dd,lv,used);
}
function mergedData(){
  const m={vocab:[],fills:[],sents:[],conj:[]};
  const seen=new Set();
  Object.keys(DATA).forEach(id=>{
    const d=DATA[id];
    d.vocab.forEach(v=>{ if(!seen.has(v.de)){seen.add(v.de);m.vocab.push(v);} });
    m.fills=m.fills.concat(d.fills); m.sents=m.sents.concat(d.sents); m.conj=m.conj.concat(d.conj);
  });
  return m;
}
function genQuestions(room,lv,n){
  const used=new Set();
  const out=[];
  let plan=shuffle(PLAN[lv]);
  const Dd=room.boss?mergedData():DATA[room.id];
  if(room.boss){
    const J=DATA.julia;
    const jp=lv===0?['fill','order','fill']:lv===1?['fill','fill','order']:['fillType','fillType','order'];
    jp.forEach(k=>{ const q=tryKind(k,{vocab:Dd.vocab,fills:J.fills,sents:J.sents,conj:[]},lv,used); if(q) out.push(q); });
    plan=plan.slice(0,n-out.length);
  }
  plan.forEach(k=>{ const q=tryKind(k,Dd,lv,used); if(q) out.push(q); });
  return shuffle(out).slice(0,n);
}

    const prog=p.level<2?'<p class="note">Para subir de nivel: <span class="dots">'+(p.prog>=1?'●○':'○○')+'</span> (7 de 8 en dos horas)</p>':'<p class="note">Nivel máximo. ¡Eres Pro!</p>';
    return '<section class="panel rcard"><h3>'+esc(p.name)+'</h3><div>'+tag(p.level)+'</div>'+
      '<div class="rstars" aria-label="'+o.stars+' de 3 estrellas">'+stars(o.stars,36)+'</div>'+
      '<p><b>'+r.c+' de '+G.per+'</b> aciertos · '+r.pts+' puntos</p>'+
      (o.up?'<div class="up">¡Subes a '+LEVELS[p.level].name+'!</div>':prog)+
      (r.wrong.length?'<div class="lab">Para repasar</div><ul class="rev">'+r.wrong.slice(0,6).map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':'<p class="note">Sin fallos. Impecable.</p>')+'</section>';
  }).join('');
  return '<h2><span class="hl">'+G.room.hour+': '+G.room.title+'</span></h2>'+win+cards+
    '<div class="row"><button class="btn ghost" data-act="again">Repetir</button><button class="btn" data-act="toMap">Volver al horario</button></div>';
}

/* ---------- Lógica de juego ---------- */
function startRoom(id){
  const room=ROOMS.find(r=>r.id===id), n=S.mode, per=8;
  const qs=[]; for(let p=0;p<n;p++) qs.push(genQuestions(room,S.players[p].level,per));
  G={room,n,per,total:per*n,i:0,qs,res:S.players.slice(0,n).map(()=>({c:0,pts:0,combo:0,wrong:[]})),ans:null,order:null,quitArm:false,out:null};
  setupQ(); S.screen='play'; render();
}
function setupQ(){
  G.ans=null; G.order=null; G.quitArm=false;
  const q=Q();
  if(q.kind==='order') G.order={placed:[]};
}
function record(ok,given,pick,note){
  const r=G.res[who()], q=Q();
  if(ok){ r.c++; r.combo++; r.pts+=10+(r.combo>=3?5:0); }
  else { r.combo=0; r.wrong.push(q.explain); }
  G.ans={ok,given,pick,note:note||''};
  speak(q.say);
  render();
}
function finishRoom(){
  const out=G.res.map((r,pi)=>{
    const p=S.players[pi];
    const st=r.c>=8?3:r.c>=6?2:r.c>=4?1:0;
    const old=p.stars[G.room.id];
    if(old===undefined||st>old) p.stars[G.room.id]=st;
    let up=false;
    if(r.c>=7&&p.level<2){ p.prog++; if(p.prog>=2){ p.level++; p.prog=0; up=true; } }
    return {stars:st,up};
  });
  G.out=out; save(); S.screen='result'; render();
}
function act(a,t){
  switch(a){
    case 'mode': S.mode=+t.dataset.v; save(); render(); break;
    case 'level': S.players[+t.dataset.i].level=+t.dataset.v; S.players[+t.dataset.i].prog=0; save(); render(); break;
    case 'home': S.screen='home'; render(); break;
    case 'toMap': S.screen='map'; save(); render(); break;
    case 'room': startRoom(t.dataset.id); break;
    case 'again': startRoom(G.room.id); break;
    case 'quit': if(G.quitArm){ G=null; S.screen='map'; } else { G.quitArm=true; } render(); break;
    case 'opt': { if(G.ans) break; const q=Q(), k=+t.dataset.k; record(q.opts[k]===q.ans,q.opts[k],k); break; }
    case 'ins': { const inp=document.getElementById('ti'); if(!inp) break; const s=inp.selectionStart==null?inp.value.length:inp.selectionStart; inp.value=inp.value.slice(0,s)+t.dataset.c+inp.value.slice(s); inp.focus(); inp.setSelectionRange(s+1,s+1); break; }
    case 'submitType': { if(G.ans) break; const inp=document.getElementById('ti'); const v=inp.value; if(!v.trim()){ inp.focus(); break; } const q=Q(), r=checkTyped(v,q.acc);
      record(r>0,v,-1,r===2?'Casi perfecto. Se escribe con la letra especial: '+q.show:(r===0?'Escribiste: '+v.trim():'')); break; }
    case 'place': if(!G.ans){ G.order.placed.push(+t.dataset.id); render(); } break;
    case 'unplace': if(!G.ans){ G.order.placed=G.order.placed.filter(x=>x!==+t.dataset.id); render(); } break;
    case 'clear': G.order.placed=[]; render(); break;
    case 'checkOrder': { if(G.ans) break; const q=Q(); const s=G.order.placed.map(id=>q.words[id]).join(' ');
      const ok=q.acc.some(a=>norm(a)===norm(s)); record(ok,s,-1,ok?'':'Tu frase: '+s+q.punct); break; }
    case 'speak': speak(Q().say); break;
    case 'speakAns': speak(Q().say); break;
    case 'next': if(G.i>=G.total-1) finishRoom(); else { G.i++; setupQ(); render(); } break;
  }
}

/* ---------- Render y eventos ---------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML=S.screen==='home'?viewHome():S.screen==='map'?viewMap():S.screen==='play'?viewPlay():viewResult();
  if(S.screen==='play'&&G){
    if(G.ans){ const nx=document.getElementById('nx'); if(nx) nx.focus({preventScroll:false}); }
    else if(Q().kind==='type'){ const ti=document.getElementById('ti'); if(ti) ti.focus({preventScroll:true}); }
  } else window.scrollTo(0,0);
}
function init(){
  load();
  const app=document.getElementById('app');
  app.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled||t.tagName==='FORM'||t.tagName==='INPUT') return; act(t.dataset.act,t); });
  app.addEventListener('submit',e=>{ e.preventDefault(); const f=e.target.closest('[data-act]'); if(f) act(f.dataset.act,f); });
  app.addEventListener('input',e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='name'){ S.players[+t.dataset.i].name=t.value.slice(0,16)||defP(+t.dataset.i).name; save(); } });
  app.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='voice'){ S.voice=t.checked; save(); } });
  render();
}
if(typeof document!=='undefined') init();
</script>
